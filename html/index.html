correctRationale":"Republic Act No. 9729 (Climate Change Act of 2009) created the Climate Change Commission under the Office of the President.","stepByStep":["Identify the pertinent constitutional article or statutory citation.","Distinguish statutory rule from non-statutory or corrupt practices."]}},{"id":"gen-099","category":"general_info","subtopic":"Philippine Constitution","level":"all","question":"Under the 1987 Constitution, who is vested with the power of the purse and holds the exclusive authority to initiate all appropriation, revenue, or tariff bills?","options":["The House of Representatives exclusively","The Senate exclusively","The Office of the President","The Supreme Court en banc"],"correctAnswer":0,"difficulty":"medium","explanation":{"correctRationale":"Article VI, Section 24 states: \"All appropriation, revenue or tariff bills, bills authorizing increase of the public debt, bills of local application, and private bills shall originate exclusively in the House of Representatives...\"","stepByStep":["Identify the pertinent constitutional article or statutory citation.","Distinguish statutory rule from non-statutory or corrupt practices."]}},{"id":"gen-100","category":"general_info","subtopic":"RA 6713 & Anti-Corruption","level":"all","question":"Under Section 7 of RA 6713, public officials are prohibited from soliciting or accepting gifts. Which of the following is considered an EXCEPTION to this rule?","options":["Unsolicited gifts of nominal or insignificant value not given in anticipation of official action","Cash donations given during bidding conferences","Foreign business air tickets sponsored by government contractors","Expensive luxury watches given during contract signing"],"correctAnswer":0,"difficulty":"easy","explanation":{"correctRationale":"Section 7(d) exempts unsolicited gifts of nominal or insignificant value not given in anticipation of, or in exchange for, an official act or favor.","stepByStep":["Identify the pertinent constitutional article or statutory citation.","Distinguish statutory rule from non-statutory or corrupt practices."]}},{"id":"cle-001","category":"clerical","subtopic":"Alphabetizing Rules","level":"sub_professional","question":"According to standard clerical indexing rules for personal names, which of the following is the correct indexed order for: \"Maria De la Cruz\", \"Carlos Del Rosario\", \"Antonio De Castro\", \"Elena Del Prado\"?","options":["De Castro, Antonio; De la Cruz, Maria; Del Prado, Elena; Del Rosario, Carlos","De la Cruz, Maria; De Castro, Antonio; Del Rosario, Carlos; Del Prado, Elena","Del Prado, Elena; Del Rosario, Carlos; De Castro, Antonio; De la Cruz, Maria","Cruz, Maria De la; Rosario, Carlos Del; Castro, Antonio De; Prado, Elena Del"],"correctAnswer":0,"difficulty":"easy","explanation":{"correctRationale":"Foreign prefixes like De, Del, De la, Von, Van, etc. are considered part of the surname and indexed letter-by-letter without spaces (De Castro -> De la Cruz -> Del Prado -> Del Rosario).","stepByStep":["1) \"De Castro\" (D-e C...) comes before \"De la Cruz\" (D-e l...)","2) \"De la Cruz\" comes before \"Del Prado\" (D-e-l P...)","3) \"Del Prado\" comes before \"Del Rosario\" (D-e-l R...)","Kaya ang tamang pagkakasunod ay: De Castro, Antonio; De la Cruz, Maria; Del Prado, Elena; Del Rosario, Carlos."],"keyFormulaOrRule":"Surname prefixes (De, Del, San, Santa, Mac, Mc) are treated as part of the surname unit in standard civil filing."}},{"id":"cle-002","category":"clerical","subtopic":"Alphabetizing Rules","level":"sub_professional","question":"How should the hyphenated personal name \"Dr. Clara Santos-Ocampo\" be properly indexed?","options":["Santos-Ocampo, Clara (Dr.)","Ocampo, Clara Santos (Dr.)","Santos, Clara Ocampo (Dr.)","Dr. Clara Santos-Ocampo"],"correctAnswer":0,"difficulty":"easy","explanation":{"correctRationale":"Hyphenated surnames are treated as a single filing unit (Santos-Ocampo). Professional titles like Dr., Atty., Engr. are placed at the end in parentheses as the final indexing unit."}},{"id":"cle-003","category":"clerical","subtopic":"Filing Procedures","level":"sub_professional","question":"Which filing system arranges records strictly by physical or administrative territory (e.g., Country, Region, Province, City)?","options":["Subject Filing","Geographical Filing","Chronological Filing","Numeric Filing"],"correctAnswer":1,"difficulty":"easy","explanation":{"correctRationale":"Geographical Filing organizes records by location or geographic territory, commonly utilized in government departments with regional and provincial field branches."}},{"id":"cle-004","category":"clerical","subtopic":"Clerical Reasoning","level":"sub_professional","question":"In comparing the two civil registry entries below:\nEntry 1: Atty. Ferdinand M. Rodriguez, 452 Mendiola St., San Miguel, Manila\nEntry 2: Atty. Ferdinand N. Rodriguez, 452 Mendiola St., San Miguel, Manila\n\nHow do the two entries compare?","options":["They are identical in all respects.","They differ in the middle initial.","They differ in the street address number.","They differ in the professional title."],"correctAnswer":1,"difficulty":"easy","explanation":{"correctRationale":"Entry 1 has middle initial \"M.\", while Entry 2 has middle initial \"N.\". All other details are identical."}},{"id":"cle-005","category":"clerical","subtopic":"Spelling & Proofreading","level":"sub_professional","question":"Which of the following government terms is spelled CORRECTLY?","options":["Bureaucracy","Bureacracy","Beurocracy","Bureocracy"],"correctAnswer":0,"difficulty":"easy","explanation":{"correctRationale":"The correct spelling is B-U-R-E-A-U-C-R-A-C-Y (from French \"bureau\" meaning office/desk + Greek \"-kratia\" meaning rule)."}},{"id":"cle-006","category":"clerical","subtopic":"Spelling & Proofreading","level":"sub_professional","question":"Identify the word with the CORRECT spelling:","options":["Accomodation","Accommodation","Acommodation","Acomodation"],"correctAnswer":1,"difficulty":"easy","explanation":{"correctRationale":"The correct spelling has double \"c\" and double \"m\": A-C-C-O-M-M-O-D-A-T-I-O-N."}},{"id":"cle-007","category":"clerical","subtopic":"Filing Procedures","level":"sub_professional","question":"What is a \"Cross-Reference Sheet\" used for in an office records filing system?","options":["To record the daily attendance of filing clerks.","To direct a searcher to an alternative location where a document might be filed under another name or subject.","To compute the annual budget for office supplies.","To shred classified confidential files."],"correctAnswer":1,"difficulty":"easy","explanation":{"correctRationale":"A Cross-Reference Sheet (or card) is placed in a file folder to guide the researcher to another folder where related materials or documents with multiple relevant names/topics are stored."}},{"id":"cle-008","category":"clerical","subtopic":"Alphabetizing Rules","level":"sub_professional","question":"When indexing business names containing numbers written as digits, such as \"3M Philippines\" and \"5th Avenue Cafe\", standard filing practice requires that:","options":["Numbers are indexed after all letters from Z.","Numbers are filed before letters in ascending numeric order, or treated as spelled out words according to agency policy.","Numbers are completely deleted from the indexing units.","Numbers are converted into Roman numerals."],"correctAnswer":1,"difficulty":"medium","explanation":{"correctRationale":"Under ARMA International rules, numbers written in digits are filed in strict numeric order before alphabetic letters, or spelled out in words if following verbal filing guidelines."}},{"id":"cle-009","category":"clerical","subtopic":"Clerical Reasoning","level":"sub_professional","question":"An administrative aide receives incoming mail marked \"CONFIDENTIAL: For the Eyes of the Regional Director Only.\" What is the proper procedure?","options":["Open the letter, photocopy it for the central registry, and then forward it.","Deliver the envelope unopened directly to the Regional Director or his authorized private secretary.","Return the letter to the post office.","Leave it on the general inquiry reception desk."],"correctAnswer":1,"difficulty":"easy","explanation":{"correctRationale":"Confidential and personal mail addressed to an official must never be opened by incoming mail clerks and must be handed directly unopened to the addressee or designated confidential assistant."}},{"id":"cle-010","category":"clerical","subtopic":"Spelling & Proofreading","level":"sub_professional","question":"Choose the correctly spelled word:","options":["Privilege","Privelege","Priviledge","Prevelege"],"correctAnswer":0,"difficulty":"easy","explanation":{"correctRationale":"The correct spelling is P-R-I-V-I-L-E-G-E (no \"d\"). Common mistake is inserting \"d\" before the \"g\"."}},{"id":"cle-011","category":"clerical","subtopic":"Office Procedures & Spelling","level":"sub_professional","question":"Which of the following official memorandum terms is spelled accurately?","options":["Liaison","Liason","Liasion","Liazon"],"correctAnswer":0,"difficulty":"medium","explanation":{"correctRationale":"The correct spelling is L-I-A-I-S-O-N (double \"i\").","stepByStep":["Recall standard ARMA / Civil Service clerical indexing conventions."]}},{"id":"cle-012","category":"clerical","subtopic":"Alphabetical Indexing Rules","level":"sub_professional","question":"In indexing business records, what is the first indexing unit for the firm \"Bureau of Internal Revenue Employees Credit Cooperative\"?","options":["Bureau","Internal","Revenue","Credit"],"correctAnswer":0,"difficulty":"easy","explanation":{"correctRationale":"Business names are indexed as written, unit by unit: Unit 1: Bureau, Unit 2: of, Unit 3: Internal, etc.","stepByStep":["Recall standard ARMA / Civil Service clerical indexing conventions."]}},{"id":"cle-013","category":"clerical","subtopic":"Filing Sys function build(level,preset){let cats=level==='professional'?['verbal','analytical','numerical','general_info']:['verbal','clerical','numerical','general_info'],base=level==='professional'?[50,45,45,30]:[50,45,40,30],total=level==='professional'?170:165,chosen=[];if(preset==='quick')chosen=shuffle(Q.filter(q=>q.level==='all'||q.level===level)).slice(0,20);else{let mult=preset==='diagnostic'?50/total:preset==='half'?.5:1;cats.forEach((c,i)=>chosen.push(...shuffle(Q.filter(q=>q.category===c&&(q.level==='all'||q.level===level))).slice(0,preset==='diagnostic'?Math.max(5,Math.round(base[i]*mult)):Math.round(base[i]*mult))));if(chosen.length<Math.min(total,Q.length)){let ids=new Set(chosen.map(q=>q.id));chosen.push(...shuffle(Q.filter(q=>(q.level==='all'||q.level===level)&&!ids.has(q.id))).slice(0,Math.min(total,Q.length)-chosen.length))}chosen=shuffle(chosen)}let mins=preset==='diagnostic'?60:preset==='quick'?25:Math.max(1,Math.round((level==='professional'?190:160)*chosen.length/total));return{questions:chosen,answers:{},i:0,level,seconds:mins*60,started:Date.now(),marked:[]}}

function submit(){if(!exam)return;clearInterval(tick);let correct=0,wrong=[],sub={};exam.questions.forEach(q=>{let ok=exam.answers[q.id]===q.correctAnswer;if(ok)correct++;else wrong.push(q.id);sub[q.category]=sub[q.category]||{total:0,correct:0};sub[q.category].total++;if(ok)sub[q.category].correct++});let pct=correct/exam.questions.length*100,spent=Math.round((Date.now()-exam.started)/1000),r={id:'exam-'+Date.now(),timestamp:Date.now(),examLevel:exam.level,totalQuestions:exam.questions.length,totalCorrect:correct,overallPercentage:+pct.toFixed(2),passed:pct>=80,timeSpentSeconds:spent,subsectionScores:sub,userAnswers:exam.answers,questionIds:exam.questions.map(q=>q.id),xpEarned:correct*10+Math.round(pct)};hist.unshift(r);hist=hist.slice(0,50);save(K.h,hist);p.examsCompleted++;p.totalXp+=r.xpEarned;p.bestRating=Math.max(p.bestRating,pct);p.incorrectQuestionIds=[...new Set(p.incorrectQuestionIds.concat(wrong))];p.masteredQuestionIds=p.masteredQuestionIds.filter(id=>!wrong.includes(id));let d=today();p.studyHistory=p.studyHistory||{};p.studyHistory[d]=(p.studyHistory[d]||0)+Math.max(1,Math.round(spent/60));p.todayStudyMinutes=p.studyHistory[d];p.lastActiveDate=d;persist();scores.unshift({id:r.id,userName:p.name,region:p.region,avatar:p.avatar,examLevel:exam.level,ratingPercentage:r.overallPercentage,correctCount:correct,totalCount:r.totalQuestions,dateStr:'Local'});scores=scores.slice(0,30);save(K.l,scores);last=r;exam=null;page='results';draw();scrollTo(0,0)}
function results(){if(!last)return home();return '<div class="card result"><div class="eyebrow">Practice complete</div><div class="score">'+last.overallPercentage.toFixed(2)+'%</div><span class="pill '+(last.passed?'good':'bad')+'">'+(last.passed?'80% practice target reached':'Below 80% practice target')+'</span><h2 style="margin-top:15px">'+last.totalCorrect+' / '+last.totalQuestions+' correct</h2><p class="sub">XP +'+last.xpEarned+' · Time '+time(last.timeSpentSeconds)+'</p><div class="actions" style="justify-content:center"><button class="btn primary" data-go="setup">New exam</button><button class="btn soft" data-go="mistakes">Review mistakes</button><button class="btn ghost" data-go="home">Dashboard</button></div></div><div class="card" style="margin-top:14px"><h3>Subject breakdown</h3>'+Object.keys(last.subsectionScores).map(k=>{let s=last.subsectionScores[k];return '<p style="display:flex;justify-content:space-between;font-size:11px"><b>'+C[k]+'</b><span>'+s.correct+'/'+s.total+' · '+Math.round(s.correct/s.total*100)+'%</span></p><div class="progress"><span style="width:'+s.correct/s.total*100+'%"></span></div>'}).join('')+'</div><div class="card" style="margin-top:14px"><h3>Answer review</h3>'+last.questionIds.map((id,i)=>{let q=get(id),a=last.userAnswers[id],ok=a===q.correctAnswer;return '<div class="review"><div class="qhead"><b>Question '+(i+1)+' · '+C[q.category]+'</b><span class="pill '+(ok?'good':'bad')+'">'+(ok?'Correct':'Incorrect / blank')+'</span></div><p style="font-size:12px;line-height:1.6">'+esc(q.question)+'</p><p class="sub">Your answer: '+(a===undefined?'No answer':esc(q.options[a]))+' · Correct: '+esc(q.options[q.correctAnswer])+'</p><p style="font-size:11px;line-height:1.7">'+esc(q.explanation?.correctRationale||'')+'</p>'+(q.explanation?.stepByStep?'<details><summary class="muted">Step-by-step</summary><ul>'+q.explanation.stepByStep.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></details>':'')+'</div>'}).join('')+'</div>'}
function bank(){let a=Q.filter(q=>(filter==='all'||q.category===filter)&&(!search||(q.question+' '+q.subtopic).toLowerCase().includes(search.toLowerCase())));return '<div class="eyebrow">Study library</div><h1 class="title">Question bank</h1><p class="sub">All '+Q.length+' practice items. Search by topic or filter by subject.</p><div class="tools" style="margin:15px 0"><input class="search" id="search" placeholder="Search question or topic..." value="'+esc(search)+'"><select class="search" id="filter"><option value="all">All subjects</option>'+Object.keys(C).map(k=>'<option value="'+k+'" '+(filter===k?'selected':'')+'>'+C[k]+'</option>').join('')+'</select><span class="pill">'+a.length+' items</span></div>'+a.map(q=>'<div class="card" style="margin:10px 0"><div class="qhead"><span>'+C[q.category]+' · '+esc(q.subtopic)+' · '+q.difficulty+'</span><button class="btn ghost small" data-book="'+q.id+'">'+(p.bookmarkedQuestionIds.includes(q.id)?'★ Saved':'☆ Save')+'</button></div><p style="font-size:13px;line-height:1.6;font-weight:700">'+esc(q.question)+'</p><details><summary style="font-size:10px;color:var(--blue);cursor:pointer">Show choices & explanation</summary><ol type="A" style="font-size:11px;line-height:1.8">'+q.options.map((o,i)=>'<li style="'+(i===q.correctAnswer?'color:var(--green);font-weight:800':'')+'">'+esc(o)+(i===q.correctAnswer?' ✓':'')+'</li>').join('')+'</ol><p style="font-size:11px;line-height:1.7">'+esc(q.explanation?.correctRationale||'')+'</p></details></div>').join('')+(a.length?'':'<div class="card empty">No matching questions.</div>')}
function mistakes(){let ids=p.incorrectQuestionIds.filter(get),q=get(ids[flash%Math.max(1,ids.length)]);return '<div class="eyebrow">Targeted revision</div><h1 class="title">Mistakes & flashcards</h1><p class="sub">Review missed questions, saved bookmarks and mastered items.</p><div class="grid stats">'+[['❌',ids.length,'MISTAKES'],['★',p.bookmarkedQuestionIds.length,'BOOKMARKS'],['🧠',p.masteredQuestionIds.length,'MASTERED'],['📚',Q.length,'TOTAL ITEMS']].map(x=>'<div class="card stat"><div class="ico">'+x[0]+'</div><div><b>'+x[1]+'</b><small>'+x[2]+'</small></div></div>').join('')+'</div><div class="grid cols"><div class="card"><h3>Flashcard deck</h3>'+(q?'<div id="flash" style="padding:28px 8px;min-height:200px;text-align:center;display:grid;place-items:center;background:var(--bg);border:1px dashed var(--blue);border-radius:12px;cursor:pointer">'+(flipped?'<div><span class="pill good">Correct answer</span><h2>'+String.fromCharCode(65+q.correctAnswer)+'. '+esc(q.options[q.correctAnswer])+'</h2><p class="sub">'+esc(q.explanation?.correctRationale||'')+'</p></div>':'<div><span class="pill">Card '+(flash%ids.length+1)+' / '+ids.length+'</span><h3 style="font-size:16px;line-height:1.6;margin-top:15px">'+esc(q.question)+'</h3><span class="muted" style="font-size:10px">Tap to flip</span></div>')+'</div><div class="tools" style="justify-content:space-between;margin-top:10px"><button class="btn ghost small" id="fprev">← Prev</button><button class="btn soft small" id="flip">Flip</button><button class="btn ghost small" id="fnext">Next →</button></div>':'<div class="empty">Complete an exam to create your flashcards.</div>')+'</div><div class="card"><h3>Unmastered mistakes</h3>'+(ids.length?ids.map(id=>{let x=get(id);return '<div class="review"><b style="font-size:11px">'+esc(x.subtopic)+'</b><p style="font-size:11px;line-height:1.5">'+esc(x.question)+'</p><div class="tools"><button class="btn soft small" data-master="'+id+'">Mark mastered</button><button class="btn ghost small" data-one="'+id+'">Practice</button></div></div>'}).join(''):'<div class="empty">🎉 No unmastered mistakes yet.</div>')+'</div></div><div class="tools" style="margin-top:14px"><button class="btn primary" id="practiceAll" '+(!ids.length?'disabled':'')+'>Practice all mistakes</button><button class="btn ghost" data-go="bank">Browse question bank</button></div>'}
function roadmap(){let acc={};Object.keys(C).forEach(k=>{let a=hist.flatMap(r=>r.questionIds.map(id=>({q:get(id),a:r.userAnswers[id]}))).filter(x=>x.q&&x.q.category===k);acc[k]=a.length?Math.round(a.filter(x=>x.a===x.q.correctAnswer).length/a.length*100):null});let weak=Object.keys(C).sort((a,b)=>(acc[a]??101)-(acc[b]??101))[0];return '<div class="eyebrow">Personal study plan</div><h1 class="title">Learning roadmap</h1><p class="sub">Based on attempts saved in this browser.</p><div class="grid cols" style="margin-top:16px"><div class="card"><h3>Subject performance</h3>'+Object.keys(C).map(k=>'<p style="font-size:11px;display:flex;justify-content:space-between"><b>'+C[k]+'</b><span class="muted">'+(acc[k]===null?'No data':acc[k]+'%')+'</span></p><div class="progress"><span style="width:'+(acc[k]??0)+'%"></span></div>').join('')+'</div><div class="card"><h3>Recommended next focus</h3><p class="sub">Start with <b>'+C[weak]+'</b>'+(acc[weak]===null?' by taking a diagnostic exam.':' based on recorded accuracy of '+acc[weak]+'%.')+'</p><button class="btn primary" data-go="setup">Start practice →</button><div class="notice" style="margin-top:15px">A category without recorded attempts is not assumed to be weak or strong.</div></div></div>'}
function leaderboard(){let samples=[['Ma. Cristina Bautista','👩‍💼','professional',96.47,164,170],['Engr. Jayson Alcantara','👨‍💼','professional',95.29,162,170],['Patricia Nicole Ramos','👩‍🎓','professional',94.71,161,170],['Christian Kyle Mendoza','👨‍🎓','sub_professional',95.76,158,165]];let a=scores.concat(samples.map((x,i)=>({id:'s'+i,userName:x[0],avatar:x[1],examLevel:x[2],ratingPercentage:x[3],correctCount:x[4],totalCount:x[5],dateStr:'Sample'}))).sort((x,y)=>y.ratingPercentage-x.ratingPercentage);return '<div class="eyebrow">Practice standings</div><h1 class="title">Leaderboard</h1><p class="sub">Your browser-local results plus illustrative sample entries. Not a live national ranking.</p><div class="card" style="overflow:auto;margin-top:15px"><table class="table"><tr><th>Rank</th><th>Examinee</th><th>Level</th><th>Score</th><th>Correct</th></tr>'+a.map((x,i)=>'<tr><td>#'+(i+1)+'</td><td>'+esc(x.avatar)+' '+esc(x.userName)+(x.id.startsWith('exam-')?' <span class="pill">You</span>':'')+'</td><td>'+x.examLevel+'</td><td><b>'+x.ratingPercentage.toFixed(2)+'%</b></td><td>'+x.correctCount+'/'+x.totalCount+'</td></tr>').join('')+'</table></div>'}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));if($('#launch'))$('#launch').onclick=()=>{p.targetLevel=$('#level').value;persist();exam=build($('#level').value,$('#preset').value);page='exam';draw();startTimer()};if($('#preset'))$('#preset').onchange=()=>$('#info').textContent=$('#preset').value==='quick'?'Quick practice · 20 items · 25 minutes.':'Question count and timer are scaled to available questions.';
 if(page==='exam'&&exam){document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{exam.answers[exam.questions[exam.i].id]=+b.dataset.a;draw()});$('#prev').onclick=()=>{exam.i--;draw()};$('#next').onclick=()=>{exam.i++;draw()};$('#mark').onclick=()=>{let id=exam.questions[exam.i].id;exam.marked=exam.marked.includes(id)?exam.marked.filter(x=>x!==id):exam.marked.concat(id);draw()};$('#submit').onclick=()=>{let n=exam.questions.length-Object.keys(exam.answers).length;if(n&&!confirm(n+' unanswered question(s). Submit anyway?'))return;submit()};document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{exam.i=+b.dataset.jump;draw()});$('#bookmark').onclick=()=>bookmark(exam.questions[exam.i].id)}
 if($('#search'))$('#search').oninput=e=>{search=e.target.value;let pos=e.target.selectionStart;draw();$('#search').focus();$('#search').setSelectionRange(pos,pos)};if($('#filter'))$('#filter').onchange=e=>{filter=e.target.value;draw()};document.querySelectorAll('[data-book]').forEach(b=>b.onclick=()=>bookmark(b.dataset.book));
 document.querySelectorAll('[data-master]').forEach(b=>b.onclick=()=>{let id=b.dataset.master;p.incorrectQuestionIds=p.incorrectQuestionIds.filter(x=>x!==id);if(!p.masteredQuestionIds.includes(id))p.masteredQuestionIds.push(id);persist();draw()});
 document.querySelectorAll('[data-one]').forEach(b=>b.onclick=()=>startCustom([get(b.dataset.one)]));if($('#practiceAll'))$('#practiceAll').onclick=()=>startCustom(p.incorrectQuestionIds.map(get).filter(Boolean));
 if($('#flash'))$('#flash').onclick=flip;if($('#flip'))$('#flip').onclick=flip;if($('#fprev'))$('#fprev').onclick=()=>{flash=Math.max(0,flash-1);flipped=false;draw()};if($('#fnext'))$('#fnext').onclick=()=>{flash++;flipped=false;draw()};
}
function flip(){flipped=!flipped;draw()}function bookmark(id){p.bookmarkedQuestionIds=p.bookmarkedQuestionIds.includes(id)?p.bookmarkedQuestionIds.filter(x=>x!==id):p.bookmarkedQuestionIds.concat(id);persist();draw()}
function startCustom(a){if(!a.length)return;exam={questions:shuffle(a),answers:{},i:0,level:p.targetLevel,seconds:Math.max(600,a.length*90),started:Date.now(),marked:[]};page='exam';draw();startTimer()}
function startTimer(){clearInterval(tick);tick=setInterval(()=>{if(!exam){clearInterval(tick);return}exam.seconds--;if($('#timer'))$('#timer').textContent=time(exam.seconds);if(exam.seconds<=0){alert('Time is up. Your exam will be submitted.');submit()}},1000)}
function profileModal(){let m=$('#modal');m.innerHTML='<div class="modalbg" id="back"><div class="modal"><div class="tools" style="justify-content:space-between"><h2>Examinee profile</h2><button class="icon" id="close">✕</button></div><div class="field"><label>NAME</label><input id="name" value="'+esc(p.name)+'"></div><div class="field"><label>REGION</label><input id="region" value="'+esc(p.region)+'"></div><div class="field"><label>AVATAR EMOJI</label><input id="avatar" value="'+esc(p.avatar)+'"></div><div class="field"><label>DAILY STUDY GOAL (MINUTES)</label><input id="goal" type="number" value="'+p.dailyGoalMinutes+'"></div><div class="field"><label>TARGET LEVEL</label><select id="target"><option value="professional">Professional</option><option value="sub_professional">Sub-Professional</option></select></div><button class="btn primary" id="saveprofile" style="width:100%">Save profile</button></div></div>';$('#target').value=p.targetLevel;$('#close').onclick=()=>m.innerHTML='';$('#back').onclick=e=>{if(e.target.id==='back')m.innerHTML=''};$('#saveprofile').onclick=()=>{p.name=$('#name').value.trim()||D.name;p.region=$('#region').value;p.avatar=$('#avatar').value||'🎓';p.dailyGoalMinutes=Math.max(5,+$('#goal').value||30);p.targetLevel=$('#target').value;persist();m.innerHTML='';draw()}}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));$('#theme').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('cse_theme',document.body.classList.contains('dark')?'dark':'light')};if(localStorage.getItem('cse_theme')==='dark')document.body.classList.add('dark');$('#profile').onclick=profileModal;draw();
</script></body></html>
